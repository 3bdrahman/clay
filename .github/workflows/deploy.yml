name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      base-path:
        description: 'Base path for deployment (use "/" for user/org pages, "/repo-name" for project pages)'
        required: false
        default: '/clay'
        type: choice
        options:
          - '/'
          - '/clay'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build
        working-directory: web
        env:
          BASE_PATH: ${{ github.event.inputs.base-path || '/clay' }}
        run: |
          npm run build
          # Add a 404.html for SPA routing on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
