name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Build
        run: |
          cd web
          GITHUB_REPOSITORY=${{ github.repository }} \
          DEPLOY_TARGET=github-pages \
          VITE_DEPLOY_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
          VITE_OPENROUTER_API_KEY=${{ secrets.VITE_OPENROUTER_API_KEY }} \
          VITE_GROQ_API_KEY=${{ secrets.VITE_GROQ_API_KEY }} \
          VITE_TOGETHER_API_KEY=${{ secrets.VITE_TOGETHER_API_KEY }} \
          VITE_NIM_API_KEY=${{ secrets.VITE_NIM_API_KEY }} \
          VITE_SERPER_API_KEY=${{ secrets.VITE_SERPER_API_KEY }} \
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4