name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Build · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check + Build
        working-directory: web
        # Mirror the deploy workflow's build env so CI validates the exact
        # configuration that ships to GitHub Pages, not a divergent variant.
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_TARGET: github-pages
          VITE_DEPLOY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build artifact summary
        if: success()
        working-directory: web
        run: |
          echo "### Build sizes" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          du -h dist/assets/*.js 2>/dev/null | sort -h >> $GITHUB_STEP_SUMMARY || true

  tests:
    name: Vitest suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Test
        working-directory: web
        run: npm run test
