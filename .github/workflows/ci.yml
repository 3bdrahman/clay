name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Build · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Type-check + Build
        working-directory: web
        env:
          BASE_PATH: '/clay'
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint -- --deny-warnings || (echo 'Lint config not yet wired; install oxlint rules in web/.oxlintrc.json' && exit 0)

      - name: Build artifact summary
        if: success()
        working-directory: web
        run: |
          echo "### Build sizes" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          du -h dist/assets/*.js 2>/dev/null | sort -h >> $GITHUB_STEP_SUMMARY || true
