<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE%favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="%BASE%favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clay — Page not found</title>
    <!--
      Static SPA fallback for hosts that serve 404.html on unknown paths
      (GitHub Pages). The %BASE% placeholder is rewritten to the resolved
      build-time base by the `base-404` Vite plugin, so the redirect lands on
      the app root under any deployment path. No scripts and no CSP meta here:
      the page is fully static content, so there is nothing for a policy to
      constrain and no CSP placeholder to leave unprocessed.
    -->
    <meta http-equiv="refresh" content="0; url=%BASE%" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e2e8f0; }
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; margin: 0 0 1rem; color: #64748b; }
      a { color: #1184e7; text-decoration: none; font-weight: 500; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Taking you to the app…</p>
      <p><a href="%BASE%">Open Clay</a></p>
    </main>
  </body>
</html>
